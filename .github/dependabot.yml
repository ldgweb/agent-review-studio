# Monthly grouped updates. Major versions of npm and cargo dependencies are
# upgraded by hand (they change APIs); the CI audit still flags advisories.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      cargo:
        patterns: ['*']
